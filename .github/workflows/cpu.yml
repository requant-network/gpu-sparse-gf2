name: CPU references and research artifact integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q -x 'build|upstream' .
      - run: python verify_records.py
      - run: python cpu_study.py --output build/ci-reference.json
      - run: python verify_results.py
      - run: python summarize_results.py
      - run: python generate_report.py
      - run: git diff --exit-code -- results/products-summary.csv results/native-summary.csv results/report-provenance.json RESULTS.md FINAL_REPORT.md
